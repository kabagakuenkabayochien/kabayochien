<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>園児台帳</title>
<style id="pageStyle">@page { size: 182mm 257mm; margin: 0; }</style>
<style>
:root {
  --main: #1f5f8b; --main-d: #164766; --main-l: #e6f0f7; --accent: #e07b39;
  --ink: #222; --sub: #666; --line: #d5dde3; --bg: #f4f6f8; --card: #fff;
  --ok: #2e7d4f; --ng: #c0392b; --warn-bg: #fff5d6;
  --gothic: "BIZ UDPGothic", "BIZ UDGothic", "Yu Gothic UI", "Yu Gothic", YuGothic, Meiryo, sans-serif;
  --mincho: "BIZ UDPMincho", "BIZ UDMincho", "Yu Mincho", YuMincho, "MS PMincho", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--gothic); color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.6; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* 上の帯 */
#top { position: sticky; top: 0; z-index: 20; background: var(--main); color: #fff; display: flex; align-items: center; gap: 10px; padding: 8px 14px; flex-wrap: wrap; }
#top h1 { font-size: 18px; margin: 0; letter-spacing: 1px; white-space: nowrap; }
#top .grow { flex: 1; }
#top select { padding: 4px 6px; border-radius: 6px; border: 0; }
#top .tbtn { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 5px 10px; white-space: nowrap; }
#top .tbtn:hover { background: rgba(255,255,255,.28); }
#top .tbtn.on { background: #fff; color: var(--main); font-weight: bold; }
#who { font-size: 13px; opacity: .9; white-space: nowrap; }
#demoBadge { background: var(--accent); color: #fff; border-radius: 6px; padding: 2px 8px; font-size: 12px; }

main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
h2 { font-size: 19px; margin: 0 0 12px; color: var(--main-d); }
h3 { font-size: 16px; margin: 0 0 10px; color: var(--main-d); border-left: 5px solid var(--main); padding-left: 8px; }
.btn { background: #fff; border: 1px solid #b8c4cc; color: var(--ink); border-radius: 8px; padding: 7px 14px; }
.btn:hover { background: #f0f4f7; }
.btn.main { background: var(--main); border-color: var(--main); color: #fff; font-weight: bold; }
.btn.main:hover { background: var(--main-d); }
.btn.danger { color: var(--ng); border-color: #e3b1aa; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--sub); font-size: 13px; }
.msg { padding: 10px 12px; border-radius: 8px; margin: 8px 0; }
.msg.err { background: #fdecea; color: var(--ng); }
.msg.ok { background: #e7f5ec; color: var(--ok); }
.msg.warn { background: var(--warn-bg); color: #7a5a00; }

/* 入る画面 */
#vLogin { max-width: 420px; margin: 60px auto; }
#vLogin .logo { text-align: center; font-size: 26px; font-weight: bold; color: var(--main); margin-bottom: 4px; }
#vLogin label { display: block; margin: 12px 0 4px; font-weight: bold; }
#vLogin input { width: 100%; padding: 10px; border: 1px solid #b8c4cc; border-radius: 8px; font-size: 17px; }
#vLogin .btn.main { width: 100%; margin-top: 18px; padding: 11px; font-size: 17px; }

/* 一覧 */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid #b8c4cc; background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.chip.on { background: var(--main); color: #fff; border-color: var(--main); font-weight: bold; }
.chip small { opacity: .75; margin-left: 3px; }
.listbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.listbar input[type=search] { flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid #b8c4cc; border-radius: 8px; }
.tbl-wrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
table.list th { background: var(--main-l); color: var(--main-d); text-align: left; padding: 6px 8px; white-space: nowrap; font-size: 13px; border-bottom: 1px solid var(--line); }
table.list td { padding: 6px 8px; border-bottom: 1px solid #edf0f2; vertical-align: middle; }
table.list tr.kid { cursor: pointer; }
table.list tr.kid:hover td { background: #f6fafc; }
table.list tr.left td { color: #999; background: #fafafa; }
table.list .kana { font-size: 11px; color: var(--sub); line-height: 1.2; }
table.list .nm { font-weight: bold; }
.badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin-left: 4px; vertical-align: middle; }
.badge.left { background: #888; color: #fff; }
.badge.officer { background: #fde7cf; color: #9a4a00; }
.sex-m { color: #1f5f8b; } .sex-f { color: #c2185b; }
.empty { text-align: center; color: var(--sub); padding: 30px 10px; }

/* 園児の画面 */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 14px; }
.f label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 2px; }
.f input, .f select, .f textarea { width: 100%; padding: 7px 9px; border: 1px solid #b8c4cc; border-radius: 7px; background: #fff; }
.f textarea { min-height: 64px; resize: vertical; }
.f.wide { grid-column: 1 / -1; }
.f .hint { font-size: 12px; color: var(--sub); }
.f.req label::after { content: " 必須"; color: var(--ng); font-size: 11px; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 14px; padding-top: 22px; }
.chk input { width: auto; }
.stickybar { position: sticky; bottom: 0; background: rgba(244,246,248,.95); padding: 10px 0; display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); z-index: 5; }
.history { font-size: 13px; }
.history span { display: inline-block; background: var(--main-l); border-radius: 6px; padding: 2px 8px; margin: 2px 4px 2px 0; }

/* 書類 */
.doc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.doc-card { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fff; text-align: left; }
.doc-card b { display: block; color: var(--main-d); }
.doc-card span { font-size: 12px; color: var(--sub); }
.doc-card.on { border: 2px solid var(--main); background: var(--main-l); padding: 8px 10px; }
#docOpts { margin-top: 12px; }
#docOpts .row { margin-bottom: 8px; }
#docOpts input[type=text], #docOpts input[type=date], #docOpts select { padding: 6px 8px; border: 1px solid #b8c4cc; border-radius: 7px; }
.hgt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 12px; margin-top: 6px; }
.hgt-grid label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.hgt-grid input { width: 80px; padding: 4px 6px; border: 1px solid #b8c4cc; border-radius: 6px; }
#preview { background: #8a959c; padding: 16px; border-radius: 10px; overflow: auto; max-height: 75vh; }
#preview .page { margin: 0 auto 16px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }

/* 管理 */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 2px solid var(--main); }
.tab { border: 1px solid var(--line); border-bottom: 0; background: #fff; border-radius: 8px 8px 0 0; padding: 6px 14px; }
.tab.on { background: var(--main); color: #fff; border-color: var(--main); font-weight: bold; }
table.edit { border-collapse: collapse; width: 100%; font-size: 14px; }
table.edit th { background: var(--main-l); padding: 5px 6px; text-align: left; font-size: 13px; }
table.edit td { padding: 4px 4px; border-bottom: 1px solid #edf0f2; }
table.edit input, table.edit select { width: 100%; padding: 5px 6px; border: 1px solid #b8c4cc; border-radius: 6px; }
.log td { font-size: 13px; }

/* 小さい画面 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: #fff; border-radius: 12px; padding: 18px; width: 100%; max-width: 420px; }
.modal label { display: block; margin: 10px 0 3px; font-size: 14px; }
.modal input { width: 100%; padding: 8px; border: 1px solid #b8c4cc; border-radius: 7px; }
#idleWarn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 60; background: #333; color: #fff; padding: 12px 16px; border-radius: 10px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
#toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 70; background: var(--ok); color: #fff; padding: 9px 18px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
#busy { position: fixed; inset: 0; z-index: 80; background: rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; font-size: 17px; color: var(--main-d); font-weight: bold; }

@media (max-width: 640px) {
  main { padding: 10px; }
  .card { padding: 12px; }
  #top { gap: 6px; padding: 6px 10px; }
  #top h1 { font-size: 15px; }
  #top .tbtn { padding: 3px 7px; font-size: 13px; }
  #who { display: none; }
  .hide-sp { display: none; }
}

/* ===== 書類（印刷される紙） ===== */
#print { display: none; }
.page { background: #fff; color: #000; position: relative; overflow: hidden; font-family: var(--gothic); page-break-after: always; break-after: page; }
.page:last-child { page-break-after: auto; break-after: auto; }
.page.b5 { width: 182mm; height: 257mm; padding: 13mm 12mm; }
.page.b5l { width: 257mm; height: 182mm; padding: 10mm 12mm; }
.page.a4 { width: 210mm; height: 297mm; padding: 14mm 13mm; }
.page table { border-collapse: collapse; }
.page .t td, .page .t th { border: 1px solid #000; padding: 0 1.2mm; font-weight: normal; overflow: hidden; }
.page .nw, .page .t tr.hd td { white-space: nowrap; }
.page .thick { border: 2px solid #000 !important; }
.pg-head { display: flex; justify-content: space-between; align-items: flex-end; font-size: 12pt; margin-bottom: 1.5mm; padding: 0 2mm; }
.kn { font-size: 6pt; line-height: 1.1; letter-spacing: .3pt; white-space: nowrap; }
.nmk { font-size: 10.5pt; line-height: 1.25; white-space: nowrap; }
.fi { display: inline-block; white-space: nowrap; }
.tcy { text-combine-upright: all; }
.up { text-orientation: upright; }
.page .kn, .page .nmk { overflow: visible; }
.c { text-align: center; }
.r { text-align: right; }
.mincho { font-family: var(--mincho); }

@media print {
  html, body { background: #fff; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  .page { box-shadow: none; margin: 0; }
}
</style>
</head>
<body>

<div id="top" class="hidden">
  <h1>📘 園児台帳</h1>
  <span id="demoBadge" class="hidden">見本</span>
  <select id="yearSel" title="年度"></select>
  <button class="tbtn" data-go="list">👧 園児</button>
  <button class="tbtn" data-go="docs">🖨 書類</button>
  <button class="tbtn" data-go="admin" id="adminBtn">⚙ 管理</button>
  <span class="grow"></span>
  <span id="who"></span>
  <button class="tbtn" id="pwBtn" title="自分のパスワードを変える">🔑</button>
  <button class="tbtn" id="logoutBtn">出る</button>
</div>

<main>
  <!-- 入る -->
  <section id="vLogin" class="card hidden">
    <div class="logo">📘 園児台帳</div>
    <p class="muted" style="text-align:center;margin:0">職員用（園児の情報が入っています）</p>
    <div id="loginMsg"></div>
    <form id="loginForm" autocomplete="on">
      <label for="loginName">名前</label>
      <input id="loginName" autocomplete="username" required>
      <label for="loginPw">パスワード</label>
      <input id="loginPw" type="password" autocomplete="current-password" required>
      <button class="btn main" type="submit">入る</button>
    </form>
    <p class="muted" style="margin-top:14px">・パスワードは職員ひとりずつちがいます。人に教えないでください。<br>・使い終わったら「出る」を押してください。しばらく使わないと自動で閉じます。</p>
  </section>

  <!-- 一覧 -->
  <section id="vList" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0" id="listTitle">園児の一覧</h2>
        <button class="btn main" id="addKidBtn">＋ 園児を追加</button>
      </div>
      <div class="chips" id="clsChips"></div>
      <div class="listbar">
        <input type="search" id="q" placeholder="🔍 名前・ふりがな・保護者名・電話番号でさがす">
        <label class="muted"><input type="checkbox" id="showLeft"> 退園した子も出す</label>
        <button class="btn small" id="renumBtn" title="このクラスの番号をあいうえお順に付け直します">あいうえお順に番号を付け直す</button>
      </div>
      <div class="tbl-wrap"><table class="list" id="kidTable"></table></div>
      <div id="listNote" class="muted" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- 園児 -->
  <section id="vEdit" class="hidden">
    <div class="card">
      <h2 id="editTitle">園児</h2>
      <div id="editMsg"></div>
      <h3>園児</h3>
      <div class="form-grid">
        <div class="f req"><label>園児名（姓と名の間に空白）</label><input data-k="name" placeholder="例：山田　花子"></div>
        <div class="f"><label>ふりがな</label><input data-k="kana" placeholder="例：やまだ　はなこ"></div>
        <div class="f"><label>性別</label><select data-k="sex"><option value="">－</option><option>男</option><option>女</option></select></div>
        <div class="f"><label>生年月日</label><input type="date" data-k="birth"><div class="hint" id="ageHint"></div></div>
      </div>
      <h3 style="margin-top:18px" id="enrollHead">クラス</h3>
      <div class="form-grid">
        <div class="f"><label>クラス</label><select id="enCls"></select></div>
        <div class="f"><label>番号（空なら最後の番号）</label><input id="enNo" inputmode="numeric"></div>
        <div class="f"><label>バス</label><input id="enBus" list="busList"></div>
        <div class="chk"><label><input type="checkbox" id="enOfficer"> 役員</label></div>
        <div class="f"><label>来年度のバス</label><input id="enNextBus" list="busList"></div>
        <div class="chk"><label><input type="checkbox" id="enNextOfficer"> 来年度の役員</label></div>
      </div>
      <datalist id="busList"></datalist>
      <div class="history" id="history" style="margin-top:8px"></div>

      <h3 style="margin-top:18px">保護者・住所・連絡先</h3>
      <div class="form-grid">
        <div class="f"><label>保護者名（姓が同じなら名前だけ）</label><input data-k="parent"></div>
        <div class="f"><label>保護者ふりがな</label><input data-k="parentKana"></div>
        <div class="chk"><label><input type="checkbox" data-k="diffSurname" value="○"> 園児と保護者が別の姓</label></div>
        <div class="f"><label>郵便番号</label><input data-k="zip" placeholder="例：435-0048"></div>
        <div class="f wide"><label>住所</label><input data-k="address"></div>
        <div class="chk"><label><input type="checkbox" data-k="diffAddress" value="○"> 園児と保護者が別の住所</label></div>
        <div class="f"><label>電話番号</label><input data-k="tel" inputmode="tel"></div>
        <div class="f"><label>連絡先①（例：母携帯）</label><input data-k="c1"></div>
        <div class="f"><label>電話番号①</label><input data-k="t1" inputmode="tel"></div>
        <div class="f"><label>連絡先②（例：父携帯）</label><input data-k="c2"></div>
        <div class="f"><label>電話番号②</label><input data-k="t2" inputmode="tel"></div>
        <div class="f"><label>兄弟関係</label><input data-k="siblings"></div>
        <div class="f wide"><label>備考（電話台帳に出ます）</label><input data-k="memo"></div>
      </div>

      <h3 style="margin-top:18px">入園・退園</h3>
      <div class="form-grid">
        <div class="f"><label>入園年月日</label><input type="date" data-k="enterDate"></div>
        <div class="f"><label>転入園年月日</label><input type="date" data-k="transferIn"></div>
        <div class="f"><label>退園・転出の年月日</label><input type="date" data-k="leaveDate"><div class="hint">入れると一覧で「退園」になり、ふだんの名簿に出なくなります</div></div>
        <div class="f"><label>退園・転園の理由など</label><input data-k="leaveNote"></div>
        <div class="f wide"><label>入園前の状況</label><input data-k="beforeEnter"></div>
      </div>

      <h3 style="margin-top:18px">園で使うメモ</h3>
      <div class="form-grid">
        <div class="f"><label>進学先</label><input data-k="school"></div>
        <div class="f"><label>療育</label><input data-k="therapy"></div>
        <div class="f wide"><label>指導上注意が必要な点</label><textarea data-k="care"></textarea></div>
        <div class="f wide"><label>学籍備考</label><textarea data-k="note"></textarea></div>
      </div>
      <p class="muted" id="updInfo"></p>
    </div>
    <div class="stickybar">
      <button class="btn main" id="saveBtn">💾 保存する</button>
      <button class="btn" id="backBtn">← 一覧にもどる</button>
      <span class="grow" style="flex:1"></span>
      <button class="btn danger" id="delBtn">削除</button>
    </div>
  </section>

  <!-- 書類 -->
  <section id="vDocs" class="hidden">
    <div class="card">
      <h2>🖨 書類を作る</h2>
      <div class="doc-cards" id="docCards"></div>
      <div id="docOpts"></div>
      <div class="row" style="margin-top:6px">
        <button class="btn main" id="printBtn">🖨 印刷する</button>
        <span class="muted" id="docInfo"></span>
      </div>
    </div>
    <div id="preview"></div>
  </section>

  <!-- 管理 -->
  <section id="vAdmin" class="hidden">
    <div class="card">
      <h2>⚙ 管理（管理者だけ）</h2>
      <div class="tabs" id="adminTabs">
        <button class="tab" data-tab="classes">クラス</button>
        <button class="tab" data-tab="staff">職員</button>
        <button class="tab" data-tab="settings">設定</button>
        <button class="tab" data-tab="import">Excelから取り込む</button>
        <button class="tab" data-tab="log">操作の記録</button>
      </div>
      <div id="adminBody"></div>
    </div>
  </section>
</main>

<div id="print"></div>
<div id="idleWarn" class="hidden"><span>しばらく使っていないので、まもなく閉じます。</span><button class="btn small" id="idleKeep">続けて使う</button></div>
<div id="toast" class="hidden"></div>
<div id="busy" class="hidden">読み込んでいます…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
'use strict';
// ===== つなぎ先 =====
var API_URL = 'https://script.google.com/macros/s/AKfycbx5q5LSZwqelmeyeJvormIn6wO5eesbAbONEw-VkCXXHY-GOaSryvTcx2YnvEJ8EuUzfQ/exec';   // Apps Script の /exec の URL。空なら見本（にせのデータ）で動く
var DEMO = !API_URL || /[?&]demo\b/.test(location.search);

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function show(id, on) { $(id).classList.toggle('hidden', !on); }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function pad(n) { return ('0' + n).slice(-2); }
function toast(t) { var el = $('toast'); el.textContent = t; show('toast', true); clearTimeout(toast.t); toast.t = setTimeout(function () { show('toast', false); }, 2200); }
function busy(on, text) { $('busy').textContent = text || '読み込んでいます…'; show('busy', on); }

var GRADES = ['星', '花', '雪', '月'];
var GRADE_NAMES = { '星': '満３歳児', '花': '３歳児', '雪': '４歳児', '月': '５歳児' };

// ===== 状態 =====
var S = {
  token: '', me: null, settings: null, years: [], currentYear: '', year: '', classes: [],
  roster: null, cls: '', view: '', edit: null, dirty: false, doc: 'classList', heights: {}
};
try { S.token = sessionStorage.getItem('daicho_token') || ''; } catch (e) {}

// ===== サーバーとのやりとり =====
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (DEMO) return Demo.call(fn, args, S.token);
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.token, fn: fn, args: args }) })
    .then(function (r) { return r.json(); })
    .catch(function () { throw new Error('つながりませんでした。インターネットを確かめて、もう一度やってください。'); })
    .then(handleResult);
}
function handleResult(r) {
  if (r && r.ok) { touchIdle(); return r.result; }
  var msg = (r && r.error) || 'うまくいきませんでした。';
  if (msg.indexOf('AUTH|') === 0) { forceLogout(msg.slice(5)); throw new Error(msg.slice(5)); }
  throw new Error(msg);
}

['click', 'keydown', 'touchstart', 'scroll', 'mousemove'].forEach(function (ev) {

// ===== 年・日付 =====
function nendo(y) { y = Number(y); return y >= 2019 ? '令和' + (y - 2018 === 1 ? '元' : y - 2018) + '年度' : '平成' + (y - 1988) + '年度'; }
function reiwaNum(y) { return Number(y) - 2018; }
function parseD(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
function eraOf(p) {
  var n = p.y * 10000 + p.m * 100 + p.d;
  if (n >= 20190501) return { s: 'R', k: '令和', y: p.y - 2018 };
  if (n >= 19890108) return { s: 'H', k: '平成', y: p.y - 1988 };
  return { s: 'S', k: '昭和', y: p.y - 1925 };
}
function wShort(s) { var p = parseD(s); if (!p) return ''; var e = eraOf(p); return e.s + e.y + '.' + p.m + '.' + p.d; }
function wLong(s) { var p = parseD(s); if (!p) return ''; var e = eraOf(p); return e.k + (e.y === 1 ? '元' : e.y) + '年' + p.m + '月' + p.d + '日'; }
function ageAt(birth, at) {
  var b = parseD(birth), a = parseD(at); if (!b || !a) return '';
  var age = a.y - b.y; if (a.m < b.m || (a.m === b.m && a.d < b.d)) age--; return age;
}
function isLeft(k, at) { return !!k.leaveDate && k.leaveDate <= (at || todayStr()); }

function loadRoster() {

    S.classes = S.classes.filter(function (c) { return c.year !== S.year; }).concat(r.classes);
  }).catch(function (e) { alert(e.message); }).then(function () { busy(false); });
}
function yearClasses() {
  return S.classes.filter(function (c) { return c.year === S.year; }).sort(function (a, b) { return (a.order - b.order) || (GRADES.indexOf(a.grade) - GRADES.indexOf(b.grade)) || a.name.localeCompare(b.name, 'ja'); });
}
function classInfo(name) { return yearClasses().filter(function (c) { return c.name === name; })[0] || { name: name, teacher: '', grade: name.charAt(0) }; }
function kidsOf(cls, includeLeft) {
  var list = (S.roster ? S.roster.children : []).filter(function (k) { return (!cls || k.enroll.cls === cls) && (includeLeft || !isLeft(k)); });
  return list.sort(byNo);
}
function byNo(a, b) {
  var ca = classOrder(a.enroll.cls), cb = classOrder(b.enroll.cls);
  if (ca !== cb) return ca - cb;
  return (Number(a.enroll.no) || 999) - (Number(b.enroll.no) || 999) || String(a.kana).localeCompare(String(b.kana), 'ja');
}
function classOrder(name) { var i = yearClasses().map(function (c) { return c.name; }).indexOf(name); return i < 0 ? 99 : i; }

// 枠に入りきらない文字（長い名前など）を、1行のまま枠に合わせて縮める
function fi(text) { return '<span class="fi">' + esc(text) + '</span>'; }
// 縦書きで数字・英字を立てる（2けたまでは1マスに横並び、3けた以上と英字は1字ずつ立てる）
function tate(text) {
  return String(text || '').replace(/[0-9]+|[A-Za-z]+|[^0-9A-Za-z]+/g, function (m) {
    if (/^[0-9]/.test(m)) return '<span class="' + (m.length <= 2 ? 'tcy' : 'up') + '">' + m + '</span>';
    if (/^[A-Za-z]/.test(m)) return '<span class="up">' + m + '</span>';
    return esc(m);
  });
}
function fitAll(root) {
  Array.prototype.forEach.call(root.querySelectorAll('.fi'), function (s) {
    s.style.cssText = '';
    var box = s.parentElement, cs = getComputedStyle(box);
    var vert = cs.writingMode.indexOf('vertical') === 0;
    var avail = vert ? box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
                     : box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var len = function () { return vert ? s.offsetHeight : s.offsetWidth; };
    var w = len();
    if (!w || avail <= 0 || w <= avail) return;
    var base = parseFloat(getComputedStyle(s).fontSize);
    var size = Math.max(base * 0.6, base * avail / w * 0.98);
    s.style.fontSize = size + 'px';
    w = len();
    if (w > avail) {   // まだ長いときは、字の高さはそのままで横だけ詰める
      s.style.marginInlineEnd = -(w - avail) + 'px';
      s.style.transformOrigin = vert ? 'top' : 'left';
      s.style.transform = (vert ? 'scaleY(' : 'scaleX(') + (avail / w) + ')';
    }
  });
}
function chunk(list, n) { var out = []; for (var i = 0; i < list.length; i += n) out.push(list.slice(i, i + n)); if (!out.length) out.push([]); return out; }

// 文字が多いときは小さくする（max 文字までは base pt のまま）
function fitStyle(text, max, base) {
  base = base || 10;
  var n = String(text || '').length;
  if (n <= max) return 'font-size:' + base + 'pt';
  return 'font-size:' + Math.max(5.5, Math.round(base * max / n * 10) / 10) + 'pt;line-height:1.15';
}

// クラス運営の「データシート」を読む
function parseClassBook(buf, fileName) {
  var wb = XLSX.read(buf, { type: 'array', sheets: ['データシート'], cellFormula: false, cellHTML: false, cellStyles: false });
  var ws = wb.Sheets['データシート'];
  if (!ws) throw new Error('「データシート」がありません。クラス運営のファイルを選んでください。');
  var get = function (addr) { var c = ws[addr]; return c ? c.v : ''; };
  var txt = function (v) { return String(v == null ? '' : v).replace(/_x000D_/g, '').replace(/\r/g, '').trim(); };
  var yRaw = Number(get('D4'));
  if (!yRaw) throw new Error('年度（D4）が読めません。');
  var year = yRaw > 1000 ? yRaw : 2018 + yRaw;
  var cls = txt(get('D5')).replace(/[\s　]/g, '');
  var grade = cls.charAt(0);
  if (GRADES.indexOf(grade) < 0) throw new Error('クラス名（D5）が「星・花・雪・月」で始まっていません：' + cls);
  var teacher = txt(get('D6')), sub1 = txt(get('E6')), sub2 = txt(get('F6'));
  // 見出し（8行目）から列を探す
  var range = XLSX.utils.decode_range(ws['!ref']);
  var col = {};
  for (var c = 0; c <= range.e.c; c++) {
    var hv = txt(get(XLSX.utils.encode_cell({ r: 7, c: c })));
    if (hv && col[hv] === undefined) col[hv] = c;
  }
  if (col['園児名'] === undefined || col['ふりがな'] === undefined) throw new Error('8行目に「園児名」「ふりがな」の見出しがありません。');
  var cellAt = function (r, name) { var c = col[name]; if (c === undefined) return ''; var cell = ws[XLSX.utils.encode_cell({ r: r, c: c })]; return cell ? cell : null; };
  var val = function (r, name) { var cell = cellAt(r, name); if (!cell) return ''; var v = txt(cell.v); return v === '---' ? '' : v; };
  var date = function (r, name) {
    var cell = cellAt(r, name); if (!cell || cell.v === '' || cell.v == null) return '';
    if (typeof cell.v === 'number') { var d = XLSX.SSF.parse_date_code(cell.v); return d ? d.y + '-' + pad(d.m) + '-' + pad(d.d) : ''; }
    var m = String(cell.v).match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/); return m ? m[1] + '-' + pad(m[2]) + '-' + pad(m[3]) : '';
  };
  var zip = function (v) { v = String(v || '').replace(/[^\d]/g, ''); return v.length === 7 ? v.slice(0, 3) + '-' + v.slice(3) : v; };
  var gi = GRADES.indexOf(grade);
  var rows = [];
  for (var r = 8; r <= Math.min(range.e.r, 120); r++) {
    var name = val(r, '園児名');
    if (!name) continue;
    var child = {
      name: name, kana: val(r, 'ふりがな'), sex: val(r, '性別'), birth: date(r, '生年月日'), zip: zip(val(r, '郵便番号')), address: val(r, '住所'),
      parent: val(r, '保護者名'), parentKana: val(r, '保護者ふりがな'), tel: val(r, '電話番号'), c1: val(r, '連絡先①'), t1: val(r, '電話番号①'),
      c2: val(r, '連絡先②'), t2: val(r, '電話番号②'), siblings: val(r, '兄弟関係'), enterDate: date(r, '入園年月日'), transferIn: date(r, '転入園年月日'),
      leaveDate: date(r, '転出園年月日'), leaveNote: val(r, '退園・転園') || val(r, '退園'), beforeEnter: val(r, '入園前の状況'), school: val(r, '進学先'),
      therapy: val(r, '療育'), care: val(r, '指導上注意が必要な点'), diffSurname: val(r, '園児と保護者が別の姓') ? '○' : '', diffAddress: val(r, '園児と保護者が別の住所') ? '○' : '',
      note: val(r, '学籍備考')
    };
    var enroll = { no: val(r, '番号'), bus: val(r, 'バス'), officer: val(r, '役員') ? '役員' : '', nextBus: val(r, '来年度バス'), nextOfficer: val(r, '来年度役員') ? '役員' : '' };
    var growth = [];
    GRADES.forEach(function (g, i) {
      if (i > gi) return;
      var focusHead = g === '雪' && col['個人の重点_雪'] === undefined ? '個人の重点_花2' : '個人の重点_' + g;
      growth.push({
        grade: g, year: String(year - (gi - i)),
        harunohi1: val(r, '春の陽' + g + '①'), harunohi2: val(r, '春の陽' + g + '②'), harunohi3: val(r, '春の陽' + g + '③'),
        focus: val(r, focusHead), guidance: val(r, '指導上参考になる事項_' + g), remarks: val(r, '備考_' + g),
        eduDays: val(r, '教育日数_' + g), attendDays: val(r, '出席日数_' + g),
        kenken: val(r, 'けんけんとび_' + g), tachihaba: val(r, '立ち幅跳び_' + g), kataashi: val(r, '片足立ち_' + g),
        maritsuki: val(r, 'まりつき_' + g), nawatobi: val(r, 'なわとび_' + g), tamanage: val(r, '球投げ_' + g),
        personal: val(r, '個人記録_' + g)
      });
    });
    rows.push({ year: year, cls: cls, teacher: teacher, sub1: sub1, sub2: sub2, child: child, enroll: enroll, growth: growth });
  }
  if (!rows.length) throw new Error('園児が1人も見つかりません。');
  return { fileName: fileName, year: String(year), cls: cls, teacher: teacher, rows: rows };
}
